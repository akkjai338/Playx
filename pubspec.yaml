name: playx_video_player
description: "PlayX Video Player - local video player with gestures, PiP and dark UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  video_player: ^2.9.2
  screen_brightness: ^1.0.1
  volume_controller: ^2.0.7
  video_thumbnail: ^0.5.3
  floating: ^5.0.1
  wakelock_plus: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
